# Publish to npm on a version tag (vX.Y.Z) via npm trusted publishing (OIDC): no token in the repo.
# One-time setup on npmjs.com: package @gredescerber/agent-crew → Settings → Trusted publishing → GitHub Actions,
# repository GredesCerber/agent-crew, workflow publish.yml.
name: publish

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read
  id-token: write # OIDC token for npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest # trusted publishing needs a recent npm
      - run: npm test
      - name: Tag matches package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, package.json $v"; exit 1; }
      - name: Publish (skipped if this version is already on npm, e.g. published by hand)
        run: |
          n="$(node -p "require('./package.json').name")"; v="$(node -p "require('./package.json').version")"
          if npm view "$n@$v" version >/dev/null 2>&1; then echo "$n@$v is already on npm — skipping"; exit 0; fi
          npm publish --provenance --access public
