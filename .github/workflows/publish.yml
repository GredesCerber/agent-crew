# Stage a release on npm on a version tag (vX.Y.Z) via npm trusted publishing (OIDC): no token in the repo.
# The trusted publisher (npmjs.com → package → Settings → Trusted publishing: GredesCerber/agent-crew, publish.yml)
# allows only `npm stage publish`: the version stays uninstallable until a maintainer approves it with 2FA
# (`npm stage approve <id>`), so a stolen CI token cannot ship a release on its own.
name: publish

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write # the GitHub Release
  id-token: write # OIDC token for npm trusted publishing and provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, registry-url: "https://registry.npmjs.org" }
      - run: npm install -g npm@latest # npm stage needs npm 11.15+
      - run: npm test
      - name: Tag matches package.json version
        run: |
          v="$(node -p "require('./package.json').version")"
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME, package.json $v"; exit 1; }
      - name: Stage on npm (skipped if this version is already on npm, e.g. published by hand)
        run: |
          n="$(node -p "require('./package.json').name")"; v="$(node -p "require('./package.json').version")"
          if npm view "$n@$v" version >/dev/null 2>&1; then echo "$n@$v is already on npm — skipping"; exit 0; fi
          npm stage publish --provenance --access public
          echo "::notice::$n@$v is staged; approve it with 2FA: npm stage approve <id> (see the output above)"
      - name: GitHub Release with notes from CHANGELOG.md (skipped if it exists)
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" 'index($0, "## [" v "]") == 1 { on = 1; next } on && /^## \[/ { exit } on' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "::error::CHANGELOG.md has no '## [$v]' section"; exit 1; }
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then echo "release exists — skipping"; exit 0; fi
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
